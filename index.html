<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spend">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Spend</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#111114; --muted:#8e8e93; --line:#e3e3e8;
  --accent:#ff6b35; --bar:rgba(249,249,251,.88); --danger:#ff3b30; --good:#34c759;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000000; --card:#1c1c1e; --text:#f2f2f7; --muted:#8e8e93; --line:#2c2c2e;
         --bar:rgba(22,22,24,.88); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  padding:env(safe-area-inset-top) 8px 0}
.hdr{display:flex;align-items:center;justify-content:space-between;height:50px;max-width:560px;margin:0 auto}
h1{font-size:17px;font-weight:600;margin:0}
.nav-btn{width:44px;height:44px;border:0;background:none;color:var(--accent);font-size:30px;line-height:1}
.nav-btn:disabled{opacity:.25}
.nav-btn.hide{visibility:hidden}
main{padding:8px 16px 24px;max-width:560px;margin:0 auto}
.view[hidden]{display:none}

.card{background:var(--card);border-radius:14px;padding:16px}
.hero .label{color:var(--muted);font-size:13px}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums;margin:2px 0}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin-top:12px}
.stack i{display:block;height:100%}

.group-h,.sec-h{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;
  margin:22px 4px 6px;text-transform:uppercase;letter-spacing:.3px}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;border:0;background:none;text-align:left;position:relative;min-height:56px}
.row+.row::before{content:"";position:absolute;left:62px;right:0;top:0;height:1px;transform:scaleY(.5);background:var(--line)}
button.row:active{background:var(--line)}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:none}
.mid{flex:1;min-width:0;display:flex;flex-direction:column}
.t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s:empty{display:none}
.amt{font-variant-numeric:tabular-nums;font-weight:500;text-align:right;flex:none}
.amt small{display:block;color:var(--muted);font-size:12px;font-weight:400}
#v-sum .amt{min-width:104px}
.chev{color:var(--muted);font-size:22px;flex:none}
.accent{color:var(--accent);font-weight:500}
.danger{color:var(--danger)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.empty{text-align:center;color:var(--muted);padding:48px 20px;line-height:1.6}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stat{background:var(--card);border-radius:14px;padding:12px}
.stat .l{color:var(--muted);font-size:12px}
.stat .v{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--danger)} .down{color:var(--good)}

.trend{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;border:0;background:none;padding:0;gap:6px}
.col .b{width:100%;max-width:38px;border-radius:6px 6px 3px 3px;background:var(--line);min-height:3px}
.col.sel .b{background:var(--accent)}
.col .m{font-size:11px;color:var(--muted)}
.col.sel .m{color:var(--text);font-weight:600}
.col .n{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}

#fab{position:fixed;right:20px;bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;
  border:0;background:var(--accent);color:#fff;font-size:34px;line-height:1;z-index:6;
  box-shadow:0 6px 18px rgba(255,107,53,.35),0 2px 4px rgba(0,0,0,.12)}
#fab:active{transform:scale(.94)}
#fab[hidden]{display:none}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
#tabs button{flex:1;border:0;background:none;color:var(--muted);font-size:10px;padding:7px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button.on{color:var(--accent)}
#tabs svg{width:26px;height:26px}

#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
#backdrop.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 20px);max-width:560px;margin:0 auto;
  background:var(--bg);border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  z-index:11;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
#sheet.open{transform:none}
.sh-h{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;height:56px;background:var(--bg);z-index:1}
.sh-h button{border:0;background:none;color:var(--accent);font-size:17px;padding:8px 0;min-width:64px;text-align:left}
.sh-h button.save{font-weight:600;text-align:right}
.sh-h b{font-size:17px}
.amt-card{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:10px 16px;margin-top:4px}
.amt-card span{font-size:30px;color:var(--muted);font-weight:500}
.amt-card input{flex:1;min-width:0;font-size:42px;font-weight:700;border:0;background:none;color:var(--text);outline:none;padding:4px 0;
  font-variant-numeric:tabular-nums;font-family:inherit}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{border:2px solid transparent;background:var(--card);border-radius:12px;padding:10px 2px 8px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:12px;min-width:0}
.chip .e{font-size:23px;line-height:1.1}
.chip .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.chip.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--card))}
.field{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:50px;position:relative}
.field+.field::before{content:"";position:absolute;left:14px;right:0;top:0;height:1px;transform:scaleY(.5);background:var(--line)}
.field>span{color:var(--muted);width:84px;flex:none;font-size:15px}
.field input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:17px;color:var(--text);outline:none;padding:13px 0;text-align:left;
  -webkit-appearance:none;appearance:none}
.field input[type=date]{min-height:24px}
.field input::-webkit-date-and-time-value{text-align:left}
.emoji-in{font-size:26px!important}
.btn-danger{width:100%;margin-top:28px;background:var(--card);border:0;border-radius:12px;color:var(--danger);font-size:17px;padding:14px}
.swatches{display:flex;flex-wrap:wrap;gap:12px;padding:14px}
.sw{width:34px;height:34px;border-radius:50%;border:0;background:var(--c)}
.sw.sel{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--c)}
.foot{color:var(--muted);font-size:13px;padding:12px 4px 0;line-height:1.5}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translate(-50%,-20px);opacity:0;
  background:rgba(30,30,32,.92);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:20;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .35s}
</style>
</head>
<body>
<header>
  <div class="hdr">
    <button class="nav-btn" id="prev" aria-label="Previous month">‹</button>
    <h1 id="title"></h1>
    <button class="nav-btn" id="next" aria-label="Next month">›</button>
  </div>
</header>

<main>
  <section id="v-log" class="view"></section>
  <section id="v-sum" class="view" hidden></section>
  <section id="v-set" class="view" hidden></section>
</main>

<button id="fab" aria-label="Add spending">+</button>

<nav id="tabs">
  <button data-v="log" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>
    Log</button>
  <button data-v="sum">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>
    Summary</button>
  <button data-v="set">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    Settings</button>
</nav>

<div id="backdrop"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast"></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";
const KEY = 'spend.v1';
const PALETTE = ['#FF6B35','#FF9F0A','#FFCC00','#34C759','#00C7BE','#32ADE6','#007AFF','#5856D6','#AF52DE','#FF2D55','#A2845E','#8E8E93'];
const DEFAULT_CATS = [
  ['Food','🍜','#FF6B35'],['Coffee','☕','#A2845E'],['Transport','🚕','#FF9F0A'],['Shopping','🛍️','#AF52DE'],
  ['Bills','💡','#007AFF'],['Fun','🎮','#FF2D55'],['Health','💊','#34C759'],['Other','📦','#8E8E93']
];
const NONE = {id:'_none', name:'Uncategorized', emoji:'❔', color:'#8E8E93'};

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

function fresh(){
  return { currency:'฿', lastCat:null, entries:[],
    categories: DEFAULT_CATS.map(([name,emoji,color]) => ({id:uid(), name, emoji, color})) };
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.categories) && Array.isArray(d.entries)) return d; }
  }catch(e){}
  return fresh();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Could not save on this device'); }
}

let S = load();
let view = 'log';
let ym = todayStr().slice(0,7);

const thisMonth = () => todayStr().slice(0,7);
const getCat = id => S.categories.find(c => c.id === id) || NONE;
const inMonth = k => S.entries.filter(e => e.date.slice(0,7) === k);
const sum = arr => Math.round(arr.reduce((a,e) => a + e.amt, 0) * 100) / 100;
const tint = hex => hex + '29';

function money(n){
  const dec = Math.round(n*100) % 100 !== 0;
  return esc(S.currency) + n.toLocaleString('en-US', {minimumFractionDigits: dec?2:0, maximumFractionDigits:2});
}
function shortMoney(n){
  if(n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
  if(n >= 1e4) return Math.round(n/1e3) + 'k';
  if(n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'') + 'k';
  return String(Math.round(n));
}
function shiftMonth(k, d){
  let [y,m] = k.split('-').map(Number); m += d;
  while(m < 1){ m += 12; y--; } while(m > 12){ m -= 12; y++; }
  return y + '-' + pad(m);
}
function monthLabel(k, opts){
  const [y,m] = k.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-GB', opts || {month:'long', year:'numeric'});
}
function dayLabel(d){
  const t = todayStr();
  const y = new Date(); y.setDate(y.getDate()-1);
  const ys = y.getFullYear()+'-'+pad(y.getMonth()+1)+'-'+pad(y.getDate());
  if(d === t) return 'Today';
  if(d === ys) return 'Yesterday';
  const [a,b,c] = d.split('-').map(Number);
  return new Date(a, b-1, c).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
}
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600);
}
function firstGrapheme(s){
  s = (s || '').trim(); if(!s) return '';
  try{ if(window.Intl && Intl.Segmenter){ const it = new Intl.Segmenter().segment(s)[Symbol.iterator]().next(); return it.done ? '' : it.value.segment; } }catch(e){}
  return Array.from(s)[0] || '';
}
function parseAmount(str){
  let s = String(str || '').trim().replace(/\s/g,'');
  if(s.includes(',') && s.includes('.')) s = s.replace(/,/g,'');
  else s = s.replace(/,/g,'.');
  s = s.replace(/[^\d.]/g,'');
  const v = parseFloat(s);
  return isFinite(v) ? Math.round(v*100)/100 : NaN;
}

/* ---------- Render ---------- */
function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('#v-log').hidden = view !== 'log';
  $('#v-sum').hidden = view !== 'sum';
  $('#v-set').hidden = view !== 'set';
  $('#fab').hidden = view !== 'log';
  const monthly = view !== 'set';
  $('#title').textContent = monthly ? monthLabel(ym) : 'Settings';
  $('#prev').classList.toggle('hide', !monthly);
  $('#next').classList.toggle('hide', !monthly);
  $('#next').disabled = ym >= thisMonth();
  if(view === 'log') renderLog();
  else if(view === 'sum') renderSum();
  else renderSet();
}

function renderLog(){
  const es = inMonth(ym).sort((a,b) => b.date.localeCompare(a.date) || b.ts - a.ts);
  const tot = sum(es);
  let h = `<div class="card hero">
    <div class="label">Spent in ${monthLabel(ym,{month:'long'})}</div>
    <div class="big">${money(tot)}</div>
    <div class="label">${es.length} ${es.length === 1 ? 'entry' : 'entries'}</div></div>`;
  if(!es.length){
    h += `<div class="empty">Nothing logged ${ym === thisMonth() ? 'yet this month' : 'for this month'}.<br>Tap <b>+</b> to add what you spend.</div>`;
  }
  const days = [];
  const byDay = {};
  es.forEach(e => { if(!byDay[e.date]){ byDay[e.date] = []; days.push(e.date); } byDay[e.date].push(e); });
  days.forEach(d => {
    h += `<div class="group-h"><span>${dayLabel(d)}</span><span>${money(sum(byDay[d]))}</span></div><div class="list">`;
    byDay[d].forEach(e => {
      const c = getCat(e.cat);
      h += `<button class="row" data-id="${e.id}">
        <span class="ic" style="background:${tint(c.color)}">${esc(c.emoji)}</span>
        <span class="mid"><span class="t">${esc(e.note || c.name)}</span><span class="s">${e.note ? esc(c.name) : ''}</span></span>
        <span class="amt">${money(e.amt)}</span></button>`;
    });
    h += `</div>`;
  });
  $('#v-log').innerHTML = h;
}

function renderSum(){
  const es = inMonth(ym);
  const tot = sum(es);
  const prevTot = sum(inMonth(shiftMonth(ym,-1)));
  const [y,m] = ym.split('-').map(Number);
  const dim = new Date(y, m, 0).getDate();
  const days = ym === thisMonth() ? new Date().getDate() : dim;
  const avg = days ? tot / days : 0;

  const totals = {};
  es.forEach(e => { const k = getCat(e.cat).id; totals[k] = (totals[k] || 0) + e.amt; });
  const rows = Object.keys(totals).map(k => ({c: k === '_none' ? NONE : getCat(k), v: Math.round(totals[k]*100)/100}))
    .sort((a,b) => b.v - a.v);

  let delta = '—', dcls = '';
  if(prevTot > 0){
    const p = (tot - prevTot) / prevTot * 100;
    delta = (p > 0 ? '▲ ' : p < 0 ? '▼ ' : '') + Math.abs(Math.round(p)) + '%';
    dcls = p > 0 ? 'up' : p < 0 ? 'down' : '';
  }

  let h = `<div class="card hero">
    <div class="label">Total for ${monthLabel(ym,{month:'long'})}</div>
    <div class="big">${money(tot)}</div>
    <div class="stack">${tot ? rows.map(r => `<i style="width:${r.v/tot*100}%;background:${r.c.color}"></i>`).join('') : ''}</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="l">Daily avg</div><div class="v">${money(Math.round(avg*100)/100)}</div></div>
    <div class="stat"><div class="l">Entries</div><div class="v">${es.length}</div></div>
    <div class="stat"><div class="l">vs last month</div><div class="v ${dcls}">${delta}</div></div>
  </div>
  <div class="sec-h"><span>By category</span></div>`;

  if(!rows.length){
    h += `<div class="list"><div class="row"><span class="mid"><span class="s" style="display:block">No spending this month.</span></span></div></div>`;
  } else {
    h += `<div class="list">` + rows.map(r => `
      <div class="row">
        <span class="ic" style="background:${tint(r.c.color)}">${esc(r.c.emoji)}</span>
        <span class="mid"><span class="t">${esc(r.c.name)}</span>
          <span class="bar"><i style="width:${Math.max(2, r.v/tot*100)}%;background:${r.c.color}"></i></span></span>
        <span class="amt">${money(r.v)}<small>${Math.round(r.v/tot*100)}%</small></span>
      </div>`).join('') + `</div>`;
  }

  const months = [];
  for(let i = 5; i >= 0; i--) months.push(shiftMonth(ym, -i));
  const vals = months.map(k => sum(inMonth(k)));
  const max = Math.max(...vals, 1);
  h += `<div class="sec-h"><span>Last 6 months</span></div><div class="card"><div class="trend">` +
    months.map((k,i) => `<button class="col ${k === ym ? 'sel' : ''}" data-m="${k}">
      <span class="n">${vals[i] ? shortMoney(vals[i]) : ''}</span>
      <span class="b" style="height:${vals[i]/max*100}%"></span>
      <span class="m">${monthLabel(k,{month:'short'})}</span></button>`).join('') +
    `</div></div>`;
  $('#v-sum').innerHTML = h;
}

function renderSet(){
  const counts = {};
  S.entries.forEach(e => counts[e.cat] = (counts[e.cat] || 0) + 1);
  let h = `<div class="sec-h" style="margin-top:8px"><span>Categories</span></div><div class="list">` +
    S.categories.map(c => `<button class="row" data-cat="${c.id}">
      <span class="ic" style="background:${tint(c.color)}">${esc(c.emoji)}</span>
      <span class="mid"><span class="t">${esc(c.name)}</span><span class="s">${counts[c.id] || 0} entries</span></span>
      <span class="chev">›</span></button>`).join('') +
    `<button class="row" data-cat="_new"><span class="ic accent" style="background:${tint('#FF6B35')}">+</span>
      <span class="mid"><span class="t accent">Add category</span></span></button></div>

  <div class="sec-h"><span>Preferences</span></div>
  <div class="list"><label class="field"><span>Currency</span>
    <input id="cur" value="${esc(S.currency)}" maxlength="4" autocomplete="off" placeholder="฿"></label></div>

  <div class="sec-h"><span>Backup</span></div>
  <div class="list">
    <button class="row" data-act="csv"><span class="mid"><span class="t">Export spending as CSV</span><span class="s">Opens in Numbers or Excel</span></span><span class="chev">›</span></button>
    <button class="row" data-act="backup"><span class="mid"><span class="t">Back up all data</span><span class="s">Save the file to iCloud Drive or Files</span></span><span class="chev">›</span></button>
    <button class="row" data-act="restore"><span class="mid"><span class="t">Restore from backup</span></span><span class="chev">›</span></button>
  </div>
  <div class="list" style="margin-top:20px">
    <button class="row" data-act="erase"><span class="mid"><span class="t danger">Erase all data</span></span></button>
  </div>
  <div class="foot">Everything stays on this iPhone — no account, no internet. Back up every so often so a lost phone doesn't mean lost history.</div>`;
  $('#v-set').innerHTML = h;
  $('#cur').addEventListener('change', e => {
    const v = e.target.value.trim(); S.currency = v || '฿'; save(); toast('Currency updated');
  });
}

/* ---------- Sheet ---------- */
let sheetHandler = null;
function openSheet(html, handler){
  const sh = $('#sheet');
  sh.innerHTML = html; sh.scrollTop = 0;
  sheetHandler = handler;
  sh.classList.add('open'); $('#backdrop').classList.add('show');
}
function closeSheet(){
  if(document.activeElement) document.activeElement.blur();
  $('#sheet').classList.remove('open'); $('#backdrop').classList.remove('show');
  sheetHandler = null;
}
$('#sheet').addEventListener('click', e => { if(sheetHandler) sheetHandler(e); });
$('#backdrop').addEventListener('click', closeSheet);

function openEntry(entry){
  const isEdit = !!entry;
  const d = entry || {amt:'', cat: (S.lastCat && S.categories.some(c => c.id === S.lastCat)) ? S.lastCat : (S.categories[0] || NONE).id, note:'', date: todayStr()};
  if(!isEdit && ym !== thisMonth()){ d.date = ym + '-01'; }
  let sel = d.cat;
  const chips = S.categories.map(c => `<button class="chip ${c.id === sel ? 'sel' : ''}" data-c="${c.id}" style="--c:${c.color}">
      <span class="e">${esc(c.emoji)}</span><span class="nm">${esc(c.name)}</span></button>`).join('');
  openSheet(`
    <div class="sh-h"><button data-a="cancel">Cancel</button><b>${isEdit ? 'Edit spending' : 'New spending'}</b><button class="save" data-a="save">Save</button></div>
    <div class="amt-card" id="amtCard"><span>${esc(S.currency)}</span>
      <input id="f-amt" inputmode="decimal" placeholder="0" autocomplete="off" value="${isEdit ? d.amt : ''}"></div>
    <div class="sec-h"><span>Category</span></div>
    <div class="chips">${chips}</div>
    <div class="sec-h"><span>Details</span></div>
    <div class="list">
      <label class="field"><span>Note</span><input id="f-note" placeholder="Optional" autocomplete="off" value="${esc(d.note)}"></label>
      <label class="field"><span>Date</span><input id="f-date" type="date" value="${d.date}"></label>
    </div>
    ${isEdit ? '<button class="btn-danger" data-a="del">Delete entry</button>' : ''}`,
  e => {
    const chip = e.target.closest('.chip');
    if(chip){
      sel = chip.dataset.c;
      document.querySelectorAll('#sheet .chip').forEach(x => x.classList.toggle('sel', x === chip));
      return;
    }
    const a = e.target.closest('[data-a]'); if(!a) return;
    const act = a.dataset.a;
    if(act === 'cancel') return closeSheet();
    if(act === 'del'){
      if(!confirm('Delete this entry?')) return;
      S.entries = S.entries.filter(x => x.id !== entry.id); save(); closeSheet(); render(); toast('Deleted');
      return;
    }
    if(act === 'save'){
      const amt = parseAmount($('#f-amt').value);
      if(!(amt > 0)){
        const c = $('#amtCard'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
        $('#f-amt').focus(); return;
      }
      const note = $('#f-note').value.trim();
      const date = /^\d{4}-\d{2}-\d{2}$/.test($('#f-date').value) ? $('#f-date').value : todayStr();
      if(isEdit){ Object.assign(entry, {amt, cat: sel, note, date}); }
      else { S.entries.push({id: uid(), amt, cat: sel, note, date, ts: Date.now()}); }
      S.lastCat = sel;
      save(); closeSheet();
      ym = date.slice(0,7);
      render(); toast(isEdit ? 'Updated' : 'Saved');
    }
  });
  if(!isEdit) $('#f-amt').focus();
}

function openCat(cat){
  const isEdit = !!cat;
  const d = cat || {name:'', emoji:'', color: PALETTE[S.categories.length % PALETTE.length]};
  let color = d.color;
  openSheet(`
    <div class="sh-h"><button data-a="cancel">Cancel</button><b>${isEdit ? 'Edit category' : 'New category'}</b><button class="save" data-a="save">Save</button></div>
    <div class="list" style="margin-top:4px">
      <label class="field"><span>Emoji</span><input id="c-emoji" class="emoji-in" value="${esc(d.emoji)}" placeholder="🙂" autocomplete="off"></label>
      <label class="field"><span>Name</span><input id="c-name" value="${esc(d.name)}" placeholder="e.g. Groceries" maxlength="24" autocomplete="off"></label>
    </div>
    <div class="sec-h"><span>Colour</span></div>
    <div class="list"><div class="swatches">${PALETTE.map(p => `<button class="sw ${p === color ? 'sel' : ''}" data-col="${p}" style="--c:${p}" aria-label="${p}"></button>`).join('')}</div></div>
    ${isEdit && S.categories.length > 1 ? '<button class="btn-danger" data-a="del">Delete category</button>' : ''}`,
  e => {
    const sw = e.target.closest('.sw');
    if(sw){
      color = sw.dataset.col;
      document.querySelectorAll('#sheet .sw').forEach(x => x.classList.toggle('sel', x === sw));
      return;
    }
    const a = e.target.closest('[data-a]'); if(!a) return;
    const act = a.dataset.a;
    if(act === 'cancel') return closeSheet();
    if(act === 'del'){
      const n = S.entries.filter(x => x.cat === cat.id).length;
      const msg = n ? `Delete "${cat.name}"? Its ${n} ${n === 1 ? 'entry' : 'entries'} will stay, marked Uncategorized.` : `Delete "${cat.name}"?`;
      if(!confirm(msg)) return;
      S.categories = S.categories.filter(x => x.id !== cat.id); save(); closeSheet(); render(); toast('Category deleted');
      return;
    }
    if(act === 'save'){
      const name = $('#c-name').value.trim();
      if(!name){ $('#c-name').focus(); toast('Give it a name'); return; }
      const emoji = firstGrapheme($('#c-emoji').value) || '•';
      if(isEdit){ Object.assign(cat, {name, emoji, color}); }
      else { S.categories.push({id: uid(), name, emoji, color}); }
      save(); closeSheet(); render(); toast(isEdit ? 'Category updated' : 'Category added');
    }
  });
  if(!isEdit) $('#c-emoji').focus();
}

/* ---------- Files ---------- */
async function giveFile(name, text, type){
  const blob = new Blob([text], {type});
  try{
    const file = new File([blob], name, {type});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function csv(){
  const q = v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const rows = [['Date','Month','Category','Amount','Note']];
  S.entries.slice().sort((a,b) => a.date.localeCompare(b.date) || a.ts - b.ts)
    .forEach(e => rows.push([e.date, e.date.slice(0,7), getCat(e.cat).name, e.amt, e.note]));
  return '\ufeff' + rows.map(r => r.map(q).join(',')).join('\n');
}

$('#v-set').addEventListener('click', e => {
  const c = e.target.closest('[data-cat]');
  if(c){ return c.dataset.cat === '_new' ? openCat(null) : openCat(S.categories.find(x => x.id === c.dataset.cat)); }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const act = a.dataset.act;
  const stamp = todayStr();
  if(act === 'csv') giveFile(`spending-${stamp}.csv`, csv(), 'text/csv');
  if(act === 'backup') giveFile(`spend-backup-${stamp}.json`, JSON.stringify(S), 'application/json');
  if(act === 'restore') $('#restoreFile').click();
  if(act === 'erase'){
    if(!confirm('Erase all spending and categories on this phone?')) return;
    if(!confirm('This cannot be undone. Erase everything?')) return;
    S = fresh(); save(); render(); toast('All data erased');
  }
});
$('#restoreFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.entries) || !Array.isArray(d.categories)) throw 0;
      if(!confirm(`Replace what's on this phone with the backup (${d.entries.length} entries, ${d.categories.length} categories)?`)) return;
      S = d; if(!S.currency) S.currency = '฿'; save(); render(); toast('Backup restored');
    }catch(err){ alert("That file isn't a Spend backup."); }
    finally{ e.target.value = ''; }
  };
  r.readAsText(f);
});

/* ---------- Wiring ---------- */
$('#v-log').addEventListener('click', e => {
  const r = e.target.closest('.row[data-id]');
  if(r) openEntry(S.entries.find(x => x.id === r.dataset.id));
});
$('#v-sum').addEventListener('click', e => {
  const c = e.target.closest('.col'); if(c){ ym = c.dataset.m; render(); }
});
$('#fab').addEventListener('click', () => openEntry(null));
$('#prev').addEventListener('click', () => { ym = shiftMonth(ym,-1); render(); });
$('#next').addEventListener('click', () => { if(ym < thisMonth()){ ym = shiftMonth(ym,1); render(); } });
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => { view = b.dataset.v; window.scrollTo(0,0); render(); }));
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && !sheetHandler) render(); });

render();

try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }catch(e){}
if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
